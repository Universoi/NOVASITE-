<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <a href="index.html" class="logo">AliExpress</a>
            <div class="search-bar">
                <input type="text" placeholder="Buscar produtos...">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="nav-icons">
                <a href="profile.html" class="account-link"><i class="fa-solid fa-user"></i> <span class="nav-text">Conta</span></a>
                <div class="cart-icon-container">
                    <a href="cart.html" class="cart-link">
                        <i class="fa-solid fa-shopping-cart"></i> <span class="nav-text">Carrinho</span>
                        <span id="cart-count">0</span>
                    </a>
                    <div id="mini-cart" class="mini-cart"></div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="profile-container">
            <h1>Seu Perfil</h1>
            <p>Gerencie os detalhes da sua conta e endereço de entrega.</p>
            <form id="profile-form">
                <div class="form-section">
                    <h2>Informações Pessoais</h2>
                    <div class="form-group">
                        <label for="full-name">Nome Completo</label>
                        <input type="text" id="full-name" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Endereço de E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Número de Telefone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>

                <div class="form-section">
                    <h2>Endereço de Entrega</h2>
                    <div class="form-group">
                        <label for="address-line1">Endereço, Linha 1</label>
                        <input type="text" id="address-line1" name="addressLine1" required>
                    </div>
                    <div class="form-group">
                        <label for="address-line2">Endereço, Linha 2 (Opcional)</label>
                        <input type="text" id="address-line2" name="addressLine2">
                    </div>
                    <div class="form-group">
                        <label for="city">Cidade</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="state">Estado / Província / Região</label>
                        <input type="text" id="state" name="state" required>
                    </div>
                    <div class="form-group">
                        <label for="zip-code">CEP / Código Postal</label>
                        <input type="text" id="zip-code" name="zipCode" required>
                    </div>
                    <div class="form-group">
                        <label for="country">País</label>
                        <input type="text" id="country" name="country" required>
                    </div>
                </div>

                <button type="submit" class="save-profile-btn">Salvar Perfil</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Vitrine Inspirada no AliExpress</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="profile.js"></script>
    <script type="module" src="cart.js"></script>
</body>
</html>
